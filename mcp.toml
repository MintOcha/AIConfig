# Portable MCP catalog for the setup menu.
#
# The web-search entry is a single local FastMCP server. Its editable runtime
# configuration is created in CODEX_HOME when the server is installed; no API
# keys are stored in this repository or in the Codex MCP command.

[mcp.web-search]
label = "Web search router"
category = "search"
description = "Provider-hidden web search, content fetching, and Tavily research with automatic fallback"
transport = "stdio"
command = "uv"
args = ["run", "--script", "{REPO_ROOT}/mcp/web_search_mcp.py", "--config", "{CODEX_HOME}/web-search-mcp.toml"]
config_template = "mcp/web-search-mcp.toml"
config_path = "{CODEX_HOME}/web-search-mcp.toml"

[[mcp.web-search.credentials]]
label = "Brave Search API key"
config_table = "providers.brave"
config_key = "api_keys"

[[mcp.web-search.credentials]]
label = "Tavily API key"
config_table = "providers.tavily"
config_key = "api_keys"
